name: CodeQL

on:
  push:
    branches: [main]
  # No base-branch filter: the analysis is a required check, so it has to run on
  # every pull request, including one stacked on another pull request.
  pull_request:
  schedule:
    - cron: "0 0 * * 0"

permissions: {}

jobs:
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: roquerodrigo/workflows/.github/workflows/codeql.yml@main
