name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: a pull request stacked on another pull request has to
  # be verified against the branch it will actually be merged into.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    uses: roquerodrigo/workflows/.github/workflows/python-lint.yml@main

  tests:
    needs: lint
    uses: roquerodrigo/workflows/.github/workflows/python-test.yml@main

  update-pr-branch:
    if: github.event_name == 'pull_request'
    needs: [lint, tests]
    permissions:
      contents: write
      pull-requests: write
    uses: roquerodrigo/workflows/.github/workflows/update-pr-branch.yml@main
