[project]
name = "midea-dishwasher-api"
version = "1.3.4"
description = "Cliente Python para lava-louças Midea (device_type 0xE1, plugin v5) — codec do frame AA + transporte LAN V3."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
authors = [
    { name = "Rodrigo Roque", email = "rodrigogoncalvesroque@gmail.com" },
]
keywords = ["midea", "dishwasher", "iot", "smart-home", "lan"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["cryptography>=43.0.0"]

[project.urls]
Homepage = "https://github.com/roquerodrigo/midea-dishwasher-api"
Repository = "https://github.com/roquerodrigo/midea-dishwasher-api"
Issues = "https://github.com/roquerodrigo/midea-dishwasher-api/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midea_dishwasher_api"]

[tool.hatch.build.targets.sdist]
include = [
    "src/midea_dishwasher_api",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=src/midea_dishwasher_api",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0",
    "pytest-asyncio>=1.3.0",
]
lint = [
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
default-groups = ["dev", "lint"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
exclude = ["scripts"]

[tool.ruff.format]
exclude = ["*.md"]  # ruff 0.16 formats Python blocks in Markdown; docs keep their own layout

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN401", "D203", "D212", "COM812", "ISC001", "CPY001"]

[tool.ruff.lint.per-file-ignores]
# The V2 layer mandates AES-ECB and MD5; both are the protocol's choice, not ours.
"src/midea_dishwasher_api/security/crypto.py" = ["S305", "S324"]
"src/midea_dishwasher_api/security/v2.py" = ["S324"]
# The protocol and state packages read the shared enums from the parent package;
# a relative parent import is the only form that resolves under mypy and at runtime.
"src/midea_dishwasher_api/protocol/*.py" = ["TID252"]
"src/midea_dishwasher_api/state/*.py" = ["TID252"]
"src/midea_dishwasher_api/transport/*.py" = ["TID252"]
"tests/*" = [
    "S101",     # assert is normal in pytest
    "S105",     # hardcoded-password-string is fine for fake test credentials
    "S106",     # hardcoded-password-func-arg is fine for fake test credentials
    "D",        # no docstrings required in tests
    "ANN",      # no type annotations required in tests
    "PLC0415",  # local imports inside tests are intentional
    "SLF001",   # testing private internals is intentional
    "PLR2004",  # magic numbers in test assertions are fine
]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
warn_unreachable = true
warn_unused_ignores = true
